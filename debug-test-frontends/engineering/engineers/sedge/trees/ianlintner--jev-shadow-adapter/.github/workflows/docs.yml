name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Pages deploys need the pages/id-token pair on the deploy job. Nothing here
# writes to the repository, so contents stays read-only.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build (strict)
        run: python -m mkdocs build --strict

      # Guard against the failure mode where custom HTML cards render Markdown
      # headings literally instead of as HTML. That renders fine in a browser
      # build log but is visibly wrong on the page, and --strict does not catch
      # it, so assert on the generated HTML directly.
      - name: Assert HTML cards rendered as HTML
        run: |
          python - <<'PY'
          import pathlib, re, sys
          home = pathlib.Path("site/index.html")
          html = home.read_text(encoding="utf-8")
          bad = re.findall(r"<p>\s*#{1,6}\s", html)
          if bad:
              sys.exit(f"literal Markdown headings found in index.html: {bad[:3]}")
          if '<div class="grid cards">' not in html:
              sys.exit("expected grid cards container missing from index.html")
          print("index.html card markup OK")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
