[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-shadow"
version = "0.1.0"
description = "Shadow-mode TypeSafe Jev routing adapter harness for Hermes (observational only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# BLE001/S110 (blind except) are intentionally not selected: the harness's
# fail-open contract requires catching broad exceptions at its boundaries,
# and every such catch already records a bounded reason code per AGENTS.md.
