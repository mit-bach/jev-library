<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev vs LLM · slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --surface: #0a0a0a; --surface-2: #111; --border: #1f1f1f; --border-strong: #2c2c2c;
    --text: #fff; --text-2: #b8b8b2; --text-3: #77776f; --lime: #c8f53a; --lime-ink: #0a0a0a; --grid: #181818;
    --mode-direct: #3987e5; --mode-jev: #d95926;
    --m1: #199e70; --m2: #c98500; --m3: #d55181; --m4: #9085e9; --m5: #e66767; --m6: #3987e5; --m7: #b5703a; --m8: #c06ad9; --m7: #d95926;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 18px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { width: 1600px; height: 900px; position: relative; transform-origin: center; background: var(--bg); overflow: hidden; }
  #stage::before { content: ""; position: absolute; right: 0; top: 0; width: 520px; height: 300px; background-image: radial-gradient(circle, #262626 1.2px, transparent 1.6px); background-size: 24px 24px; mask-image: linear-gradient(to left, #000, transparent); pointer-events: none; }
  .slide { position: absolute; inset: 0; padding: 64px 90px 76px; opacity: 0; transform: translateX(40px); transition: opacity .35s ease, transform .35s ease; pointer-events: none; display: flex; flex-direction: column; }
  .slide.on { opacity: 1; transform: none; pointer-events: auto; }
  .slide.prev { transform: translateX(-40px); }
  .crumb { font-family: var(--mono); font-size: 15px; color: var(--text-2); margin-bottom: 14px; }
  .crumb b { color: var(--lime); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 14px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); width: max-content; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); display: inline-block; }
  h1 { font-size: 78px; line-height: 1.0; letter-spacing: -.035em; font-weight: 800; margin: 22px 0 18px; }
  h1 em, h2 em { font-style: normal; color: var(--lime); }
  h2 { font-size: 44px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; margin: 12px 0 10px; }
  .lead { color: var(--text-2); font-size: 22px; max-width: 900px; margin: 0 0 22px; }
  .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); margin-bottom: 8px; }
  .row { display: flex; gap: 22px; flex: 1; min-height: 0; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stat { padding: 26px 28px; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: 0; }
  .stat .k { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); }
  .stat .v { font-size: 64px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; margin-top: 6px; color: var(--lime); }
  .stat .v small { font-size: 16px; color: var(--text-2); font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .stat .d { color: var(--text-2); font-size: 15px; margin-top: 4px; }
  ul.bul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 21px; color: var(--text-2); }
  ul.bul li::before { content: "+ "; color: var(--lime); font-weight: 700; }
  ul.bul b { color: var(--text); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .card .hd { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
  .card .hd .dots { display: flex; gap: 5px; margin-right: 6px; } .card .hd .dots i { width: 8px; height: 8px; border-radius: 50%; background: #2e2e2e; display: block; }
  .card .hd .t { color: var(--text); font-weight: 600; flex: 1; text-align: center; } .card .hd .tag { color: var(--lime); font-size: 11px; letter-spacing: .06em; }
  .card .bd { padding: 14px 16px; overflow: hidden; flex: 1; min-height: 0; }
  .card .ft { background: var(--lime); color: var(--lime-ink); font: 500 12px var(--mono); padding: 5px 14px; display: flex; gap: 22px; }
  pre.code { margin: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; font: 13.5px/1.5 var(--mono); color: var(--text-2); white-space: pre; overflow: hidden; }
  pre.code .k { color: var(--lime); } pre.code .s { color: #9ec5f4; } pre.code .c { color: var(--text-3); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--text-2); margin: 2px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--c); }
  svg { display: block; } svg text { fill: var(--text-2); font-family: var(--mono); font-size: 11px; } svg text.val { fill: var(--text); }
  svg .grid line { stroke: var(--grid); } svg .axis line { stroke: var(--border-strong); } svg .ideal { stroke: var(--text-3); stroke-dasharray: 3 3; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border-strong); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--text-2); background: transparent; font: 500 13px var(--mono); display: inline-flex; align-items: center; gap: 7px; }
  .chip i { width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--text-3)); } .chip.on { color: var(--lime-ink); background: var(--lime); border-color: var(--lime); }
  table { width: 100%; border-collapse: collapse; font: 14px var(--mono); }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-3); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; font-size: 11px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .tl li { display: flex; gap: 10px; align-items: baseline; } .tl .k { flex: 0 0 90px; color: var(--text-3); font-family: var(--mono); font-size: 12px; }
  .tok { display: inline-block; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface-2); font-family: var(--mono); font-size: 13px; color: var(--text); }
  .tok.jev { border-color: var(--mode-jev); } .tok.wrong { border-color: var(--crit); color: #ff9c9c; }
  .conf { color: var(--text-3); font-family: var(--mono); font-size: 12px; }
  .bignum { font-size: 150px; font-weight: 800; letter-spacing: -.05em; line-height: 1; color: var(--lime); }
  .bignum small { font-size: 22px; color: var(--text-2); font-weight: 400; letter-spacing: 0; display: block; margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; min-height: 0; align-items: start; }
  .two > .card, .three > .card { max-height: 100%; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; flex: 1; min-height: 0; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cat { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 13px; color: var(--text-2); display: flex; justify-content: space-between; }
  .cat b { color: var(--lime); }
  .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; font-family: var(--mono); font-size: 13.5px; color: var(--text-2); }
  .pairs span b { color: var(--text); font-weight: 500; } .pairs .vs { color: var(--lime); }
  .finding { border-left: 3px solid var(--mode-jev); padding: 8px 14px; margin-bottom: 12px; }
  .finding b { color: var(--text); } .finding .conf { display: block; margin-top: 4px; }
  .foot { position: absolute; left: 90px; right: 90px; bottom: 28px; z-index: 2; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--text-3); }
  .foot .brand { display: flex; align-items: center; } .foot .brand svg { display: block; height: 28px; width: auto; }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--lime); width: 0; transition: width .3s; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; background: #0d0d0d; border-top: 1px solid var(--border-strong); color: var(--text-2); font: 15px/1.5 var(--sans); padding: 14px 24px; display: none; max-height: 30vh; overflow: auto; z-index: 20; }
  #notes.on { display: block; } #notes b { color: var(--lime); font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  #help { position: fixed; top: 12px; right: 16px; font: 12px var(--mono); color: var(--text-3); z-index: 20; }
  .diagram text { font-family: var(--mono); font-size: 13px; fill: var(--text-2); } .diagram .box { fill: var(--surface); stroke: var(--border-strong); } .diagram .lime { stroke: var(--lime); } .diagram .t { fill: var(--text); font-weight: 600; font-size: 14px; }
  .diagram .arrow { stroke: var(--text-3); stroke-width: 1.5; fill: none; marker-end: url(#ah); } .diagram .lane { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="help"></div>
<div id="stage-wrap"><div id="stage">
  <div id="slides"></div>
  <div class="foot"><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 44" width="150" height="31"> <g transform="translate(0, 6)" fill="none" stroke="#FFFFFF"> <rect x="8" y="8" width="24" height="24" stroke-width="1"></rect> <rect x="4" y="4" width="24" height="24" stroke-width="1.5"></rect> <rect x="0" y="0" width="24" height="24" stroke-width="2"></rect> </g> <g font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="-0.6"> <text x="44" y="28" font-size="18" font-weight="600" fill="#FFFFFF">AI Coders <tspan font-weight="300" fill="#A1A1AA">Academy</tspan></text> </g> </svg></div><span id="counter"></span></div>
  <div id="progress"></div>
</div></div>
<div id="notes"></div>

<script src="charts.js"></script>
<script>
// ---------- strings (English default, Portuguese via the L key) ----------------
const STR = {
  en: {
    help: "← → navigate · F fullscreen · N notes · E export HTML · L language · D dashboard",
    modeDirect: "LLM direct", modeDirectShort: "direct", modeJev: "Jev classifier", modeJevShort: "jev",
    noRun: "no run", noTrace: "no trace", none: "none",
    counter: (i, n) => `jev vs llm · ${LANG.toUpperCase()} · ${i} / ${n}`,
    notesHead: (i) => `notes · slide ${i}`,
    // slide 1
    n1: "Opening. The question of the study: in an agent with many tools, who should pick the next tool — the LLM reasoning on its own, or a specialized classifier in front of it?",
    pill1: "case study · eve · typesafe jev · openrouter",
    h1: "Who picks the tool:<br>the LLM or <em>Jev</em>?",
    lead1: "Replacing the model's reasoning with a System-One classifier for tool selection in a personal agent with 100 tools.",
    agenda1: "+ methodology", agenda2: "+ traces and evals", agenda3: (n) => `+ results across ${n} models`, agenda4: "+ where it stumbles",
    // slide 2
    n2: "The problem: on every step the agent resends all 100 tool definitions, and the model spends reasoning just to decide which one to call. That scales badly in tokens, cost and latency, and leaves room to confuse similarly named tools.",
    k2: "the problem",
    h2: "Every agent step carries the whole catalog and <em>thinks</em> to choose",
    s2a: "tools in context", s2aSub: "per step", s2aD: "every definition, every time",
    s2b: "input tokens per step", s2bD: "measured average in direct mode",
    s2c: "decisions per task", s2cSub: "LLM calls", s2cD: "each one with reasoning on",
    b2a: "<b>Cost grows with the catalog</b>, not with the task.",
    b2b: "<b>Latency</b>: the model reasons before every tool call.",
    b2c: "<b>Look-alike tools</b> (<code>flights_hold</code> × <code>flights_book</code>, <code>email_send</code> × <code>email_send_later</code>) become noise in the prompt.",
    // slide 3
    n3: "The idea: Jev is a System One model. It does not generate text; it answers closed questions (choice, score, noul) with probabilities and calibrated confidence, in hundreds of milliseconds. Proposal: Jev decides WHICH tool; the LLM decides HOW to call it, without reasoning.",
    k3: "the idea",
    h3: "Separate <em>which</em> tool from <em>how</em> to call it",
    b3a: "<b>Jev (TypeSafe)</b> is a System One model: it does not generate text, it returns a typed decision.",
    b3b: "A <b>choice</b> question with 100 tools + <code>respond_to_user</code> → pick, probability distribution and confidence.",
    b3c: (lat) => `Measured classifier latency: <b>${lat}</b> per decision.`,
    b3d: "The LLM runs with <b>reasoning off</b> (or the lowest it accepts) and only fills in the arguments of the chosen tool.",
    c3: "jev · a real decision", c3tag: "choice · 101 options",
    c3pick: (name, conf, ms) => `pick: ${name} · confidence ${conf}% · ${ms} ms`,
    // slide 4
    n4: "Architecture. Two modes of the same eve agent, selected by an environment variable. In direct mode the LLM sees all 100 tools on every step. In Jev mode, before each model call the dynamic resolver builds the conversation state, asks Jev and exposes only the chosen tool.",
    k4: "architecture",
    h4: "Two modes, <em>one</em> parameter apart",
    d4lane1: "llm-direct mode", d4lane2: "jev-classifier mode",
    d4user: "user", d4prompt: "prompt",
    d4llmOn: "LLM · reasoning on", d4llmOnSub: "sees all 100 tools, picks and fills args", d4tokPerStep: (t) => `~${t} tokens in / step`,
    d4tool: "tool", d4world: "mock world",
    d4loop1: "result goes back to context · repeats until it answers",
    d4jev: "Jev · System One", d4jevSub1: "state = compacted history", d4jevSub2: "choice(100 tools + respond) + noul(done?)",
    d4oneTool: "1 tool",
    d4llmOff: "LLM · reasoning off", d4llmOffSub1: "sees only the chosen tool", d4llmOffSub2: "fills in the arguments",
    d4loop2: "result goes back · Jev decides again · respond_to_user ends",
    d4code1: 'export const MODE = "llm-direct" | "jev-classifier"   ← the only difference between the branches',
    d4code2: 'agent/tools/catalog.ts   defineDynamic({ "session.started": all 100 })   vs.   defineDynamic({ "step.started": jev picks 1 or none })',
    // slide 5
    n5: "How it was built. The agent is an eve (Vercel) project. Dynamic tools with defineDynamic: on the step.started event the resolver receives ctx.messages, builds the state, calls Jev through the TypeSafe SDK and returns a map with a single tool. Returning null means 'no tools': the model answers the user. The completion gate keeps it from answering too early.",
    k5: "implementation · eve + typesafe sdk",
    h5: "The router is a dynamic <em>step.started</em> resolver",
    code5mode: "// agent/tools/catalog.ts (jev-classifier mode)",
    code5noTools: "// no tools → answer", code5oneTool: "// only 1 tool exposed",
    code5hundred: "// 100 tools + respond", code5noul: "has every requested action been done?", code5next: "nextBest", code5gate: "// gate",
    b5a: "<b>eve</b> (Vercel): the agent is a folder; tools, evals and traces are native.",
    b5b: "<b>ctx.messages</b> becomes <code>state</code>: the user request + actions already taken with truncated results.",
    b5c: "The choice <b>criteria</b> = the same descriptions the LLM sees. One source of truth.",
    b5d: "<b>Reasoning</b>: off where the endpoint allows it (GPT, DeepSeek); minimal (<code>low</code>) on Gemini, which cannot disable it.",
    b5e: "<b>OpenRouter</b> for every model, with the upstream pinned on Gemini because of thought signatures.",
    // slide 6
    n6: "The catalog: 100 personal-assistant tools in 13 categories, with mock executors over a deterministic world (calendar, contacts, flights, expenses). Twelve look-alike name pairs were planted on purpose to measure 'wrong tool'.",
    k6: "the catalog",
    h6: "100 tools, <em>12 pairs</em> of look-alike names planted on purpose",
    b6a: "<b>Deterministic</b> mock world: same calendar, contacts, flights and expenses for every run.",
    b6b: "Each tool = name, description, zod schema and executor. The descriptions feed <b>both the LLM and Jev</b>.",
    c6: "confusable pairs", c6tag: "calling the wrong sibling = wrong tool",
    // slide 7
    n7: "The six tasks: three basic and three complex. All of them carry a condition or an implicit ordering, and each defines the required steps (tool families) and the list of distractors. The ideal path is the minimum number of calls.",
    k7: "the tasks",
    h7: "6 multi-step requests with <em>conditions</em> and distractors",
    lang7: "Prompts are sent to the agent in Portuguese: the benchmark persona is a Brazilian user (Rio/São Paulo, BRL, PIX). English translations are shown for reference only.",
    th7id: "id", th7task: "task", th7tier: "tier", th7req: "required steps", th7ideal: "ideal",
    tierComplex: "complex", tierBasic: "basic",
    // slide 8
    n8: "Traces. eve records a durable event stream per session: step start, requested actions, tool result, step end with token usage. The router writes Jev's decisions to a JSONL. The harness joins the two by session id and builds the per-step timeline.",
    k8: "traces",
    h8: "Two streams, joined by the <em>sessionId</em>",
    c8a: "eve event stream",
    c8aL1: "modelId, stepIndex", c8aL2: "reasoning text (when present)", c8aL3: "tool calls with arguments", c8aL4: "tool output and status", c8aL5: "finishReason + usage (tokens)", c8aL6: "final answer",
    c8b: "jev-trace.jsonl", c8bTag: "1 line per decision",
    c8c: (m) => `timeline · ${m} · jev · p4`, c8cTag: "built by the harness",
    // slide 9
    n9: "Evals. We use eve eval: each task is a defineEval that sends the prompt, waits for the turn to close and receives the full stream. From that we derive deterministic metrics — no LLM judge — and write one JSON per run that feeds this deck and the dashboard.",
    k9: "evals and metrics",
    h9: "<em>Deterministic</em> grading, no LLM judge",
    code9persist: "// eval-results/&lt;mode&gt;/&lt;model&gt;/&lt;task&gt;.json",
    code9cmd: "$ MODELS=all npm run eval:all      # 2 modes × 8 models × 6 tasks",
    th9metric: "metric", th9def: "definition",
    m9steps: "steps", m9stepsD: "LLM calls in the turn (<code>step.started</code>)",
    m9tools: "tools / ideal", m9toolsD: "tool calls made vs. the ideal-path minimum",
    m9wrong: "wrong tool", m9wrongD: "a call to a look-alike distractor",
    m9compl: "completion", m9complD: "fraction of required steps covered",
    m9eff: "efficiency", m9effD: "completion × ideal ÷ calls × ½ if a wrong tool was called",
    m9tok: "tokens / cost", m9tokD: "reported usage × OpenRouter public price",
    m9jev: "jev", m9jevD: "classifier decisions, with confidence, <code>done</code> and gate",
    // slide 10
    n10: "Results, steps and calls. In Jev mode there is always one tool per step plus a final answer step, so the number of LLM calls goes up. In exchange, tool calls stay closer to the ideal path. Switch the model with the chips.",
    k10: "results · 1/3",
    h10: "More steps, <em>fewer</em> unnecessary tool calls",
    c10a: (m) => `${m} · model steps`, c10aTag: "LLM calls · fewer = better",
    c10b: (m) => `${m} · tool calls`, c10bTag: "dashed = ideal path",
    // slide 11
    n11: "Tokens and cost: this is the main gain. With Jev the context no longer carries 100 tool definitions on every step. The reduction in input tokens, measured on the same model and the same tasks, lands between 75 and 85 percent, and cost drops in the same proportion.",
    k11: "results · 2/3",
    h11: "Where the classifier <em>pays for itself</em>",
    big11: (n) => `input tokens with Jev vs. the same model choosing among 100 tools (average of ${n} models)`,
    th11model: "model", th11tok: "tokens in", th11cost: "cost",
    c11: "tokens per series · sum of the 6 tasks", c11tag: "reported usage",
    l11in: "input · direct", l11inJev: "input · jev", l11out: "output", partIn: "input", partOut: "output",
    // slide 12
    n12: "Efficiency combines completion, adherence to the ideal path and the absence of wrong tools. An important finding: with the catalog as it is, no model fell for a look-alike tool in direct mode. The hypothesis that the LLM gets lost in the names was not confirmed here; Jev's gain is cost and step discipline, not precision.",
    k12: "results · 3/3",
    h12: "Efficiency and <em>wrong tool</em>",
    c12: "efficiency ranking (0–100)", c12tag: "average of the 6 tasks", ideal: "ideal",
    s12a: "wrong tool · direct", s12aD: (n) => `in ${n} runs`,
    s12b: "wrong tool · jev", s12bD: (n, g) => `in ${n} runs · gate fired ${g}×`,
    s12c: "completion · direct", s12d: "completion · jev", toolsPerTask: (n) => `${n} tools/task`,
    // slide 13
    n13: "Where Jev stumbles. Three patterns: the LLM invents arguments (attendee emails) and Jev, seeing the meeting created, never routes to the contact lookup; Jev wants to answer too early, hence the gate with the completion noul; and the wrong sibling of a tool shows up now and then in the classifier itself. The classifier decides between actions, but it cannot force a lookup the model skipped.",
    k13: "where jev stumbles",
    h13: "The classifier picks the action, but <em>does not force</em> the lookup",
    b13a: "<b>Invented arguments.</b> In p5 the LLM fills in the attendees' emails from memory; the meeting \"works\" and Jev sees no reason to look up contacts.",
    b13b: "<b>Answering early.</b> Without the gate, <code>respond_to_user</code> won with a step still pending. The <code>noul</code> \"all done?\" blocks it.",
    b13c: "<b>Wrong sibling.</b> Jev itself confuses <code>task_create</code> × <code>task_create_subtask</code> or <code>alarm_set</code> × <code>reminder_create</code> in low-confidence decisions.",

let data = null, modelKeys = [], primary = null;
const modelColor = (k) => MODEL_COLORS[Math.max(0, modelKeys.indexOf(k)) % MODEL_COLORS.length];
const modelLabel = (k) => { for (const s of Object.values(data.series)) if (s.modelKey === k) { const r = Object.values(s.runs)[0]; if (r?.modelLabel) return r.modelLabel; } return k; };
const seriesOf = (k, mode) => Object.values(data.series).find((s) => s.modelKey === k && s.mode === mode);
const listOf = (s) => s ? PROMPT_ORDER.map((p) => s.runs[p]).filter(Boolean) : [];

// ---------- derived numbers used in the story ---------------------------------
function facts() {
  const runs = allRuns();
  const direct = runs.filter((r) => r.mode === "llm-direct"), jev = runs.filter((r) => r.mode === "jev-classifier");
  const tokPerStep = direct.length ? sum(direct, (r) => r.usage.inputTokens) / sum(direct, (r) => r.modelSteps) : null;
  const jevDecisions = jev.flatMap((r) => r.timeline.filter((e) => e.kind === "jev"));
  const latency = avg(jevDecisions.filter((e) => e.latencyMs), (e) => e.latencyMs);
  const saved = [];
  for (const k of modelKeys) { const d = seriesOf(k, "llm-direct"), j = seriesOf(k, "jev-classifier"); if (d && j) { const ids = PROMPT_ORDER.filter((p) => d.runs[p] && j.runs[p]); const di = sum(ids, (p) => d.runs[p].usage.inputTokens), ji = sum(ids, (p) => j.runs[p].usage.inputTokens); if (di) saved.push({ k, pct: 1 - ji / di, cost: 1 - sum(ids, (p) => j.runs[p].usage.estimatedCostUsd) / Math.max(1e-9, sum(ids, (p) => d.runs[p].usage.estimatedCostUsd)) }); } }
  return { runs, direct, jev, tokPerStep, latency, jevDecisions, saved, gated: jevDecisions.filter((e) => e.gated).length,

function timelineHtml(run, max = 12) {
  if (!run) return `<div class="conf">${T.noRun}</div>`;
  const wrong = new Set(run.distractorTools ?? []);
  return `<ul class="tl">${run.timeline.slice(0, max).map((e) => {
    if (e.kind === "jev") return `<li><span class="k">step ${e.step} · jev</span><span><span class="tok jev">${esc(e.name)}</span> <span class="conf">conf ${fmt(e.confidence * 100)}%${e.done != null ? ` · done ${fmt(e.done * 100)}%` : ""}${e.gated ? " · ⛔ gate" : ""} · ${e.latencyMs} ms</span></span></li>`;
    if (e.kind === "model") return `<li><span class="k">step ${e.step}</span><span class="conf">→ ${esc(e.name)}</span></li>`;
    if (e.kind === "tool") return `<li><span class="k"></span><span><span class="tok ${wrong.has(e.name) ? "wrong" : ""}">${esc(e.name)}</span> <span class="conf">${esc(JSON.stringify(e.detail)).slice(0, 70)}…</span></span></li>`;
    if (e.kind === "message") return `<li><span class="k"></span><span class="conf">💬 ${esc(String(e.detail).slice(0, 110))}…</span></li>`;
    return "";
  }).join("")}</ul>`;
}

      ${card(T.c14c, `<ul class="bul" style="font-size:17px"><li>${T.c14cL1}</li><li>${T.c14cL2}</li><li>${T.c14cL3}</li></ul>`, { tag: T.c14cTag })}
    </div>
    <div class="stats" style="margin-top:18px">
      <div class="stat"><div class="k">${T.s14a}</div><div class="v">${avgSave != null ? "−" + fmt(avgSave * 100) + "%" : "–"}</div><div class="d">${T.s14aD}</div></div>
      <div class="stat"><div class="k">${T.s14b}</div><div class="v">${fmt(F.stepsDirect, 1)}<small>→ ${fmt(F.stepsJev, 1)}</small></div><div class="d">${T.s14bD}</div></div>
      <div class="stat"><div class="k">${T.s14c}</div><div class="v">${fmt(F.complDirect * 100)}%<small>→ ${fmt(F.complJev * 100)}%</small></div><div class="d">${T.s14cD}</div></div>
    </div>` });

  S.push({ notes: T.n15, html: `
    <div class="crumb">~/academy/evals/<b>jev-vs-llm</b></div>
    <h2>${T.h15}</h2>
    <pre class="code" style="font-size:18px;margin-top:10px">cp .env.example .env.local        <span class="c">${T.code15a}</span>
MODELS=all npm run eval:all        <span class="c">${T.code15b}</span>
npm run ui                         <span class="c">${T.code15c}</span></pre>
    <ul class="bul" style="margin-top:26px"><li><b>eve</b> · eve.dev · <b>TypeSafe Jev</b> · docs.typesafe.ai · <b>OpenRouter</b> · openrouter.ai</li><li>${T.b15}</li></ul>
    <div style="margin-top:auto"><span class="pill"><span class="dot"></span>${T.pill15}</span></div>` });

  return S;
}

// ---------- deck runtime ------------------------------------------------------
let slides = [], idx = 0;
function render() {
  if (!data) return;
  document.getElementById("help").textContent = T.help;
  slides = buildSlides();
  const host = document.getElementById("slides");
  host.innerHTML = slides.map((s, i) => `<section class="slide" data-i="${i}">${s.html}</section>`).join("");
  show(Math.min(idx, slides.length - 1));
}
function show(i) {
  idx = Math.max(0, Math.min(slides.length - 1, i));
  document.querySelectorAll(".slide").forEach((el, j) => { el.classList.toggle("on", j === idx); el.classList.toggle("prev", j < idx); });
  document.getElementById("progress").style.width = ((idx + 1) / slides.length * 100) + "%";
  document.getElementById("counter").textContent = T.counter(idx + 1, slides.length);
  document.getElementById("notes").innerHTML = `<b>${esc(T.notesHead(idx + 1))}</b>${esc(slides[idx].notes)}`;
  history.replaceState(null, "", `#${idx + 1}`);
}
function fit() { const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900); document.getElementById("stage").style.transform = `scale(${s})`; }
window.addEventListener("resize", fit);
document.addEventListener("keydown", (e) => {
  if (["ArrowRight", " ", "PageDown"].includes(e.key)) { e.preventDefault(); show(idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(idx - 1); }
  else if (e.key === "Home") show(0); else if (e.key === "End") show(slides.length - 1);
  else if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (e.key.toLowerCase() === "n") document.getElementById("notes").classList.toggle("on");
  else if (e.key.toLowerCase() === "e") exportHtml();
  else if (e.key.toLowerCase() === "l") setLang(LANG === "en" ? "pt" : "en");
  else if (e.key.toLowerCase() === "d" && !EMBEDDED) location.href = "/";
});
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-primary]");
  if (c) { primary = c.dataset.primary; render(); return; }
  if (e.target.closest("#notes, #help")) return;
  show(e.clientX > window.innerWidth / 2 ? idx + 1 : idx - 1);
});
const EMBEDDED = typeof window.__RESULTS__ === "object" && window.__RESULTS__ !== null;
async function exportHtml() {
  if (!data) return;
  const [page, charts] = await Promise.all([fetch("/slides.html").then((r) => r.text()), fetch("/charts.js").then((r) => r.text())]);
  const safe = (o) => JSON.stringify(o).replace(/<\//g, "<\\/");
  const html = page.replace('<script src="charts.js"><' + '/script>', `<script>window.__RESULTS__ = ${safe(data)};\nwindow.__LANG__ = ${JSON.stringify(LANG)};<\/script>\n<script>${charts.replace(new RegExp("<\\/(script)", "gi"), "<\\/$1")}<\/script>`);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `jev-vs-llm-slides-${LANG}-${new Date().toISOString().slice(0, 10)}.html`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function load() {
  document.getElementById("help").textContent = T.help;
  if (EMBEDDED) { data = window.__RESULTS__; }
  else { const res = await fetch("/results.json", { cache: "no-store" }); data = await res.json(); }
  modelKeys = [...new Set(Object.values(data.series).map((s) => s.modelKey))].sort((a, b) => (MODEL_ORDER.indexOf(a) + 1 || 99) - (MODEL_ORDER.indexOf(b) + 1 || 99));
  primary = primary && modelKeys.includes(primary) ? primary : modelKeys[0] ?? null;
  const h = parseInt(location.hash.slice(1), 10); if (h) idx = h - 1;
  fit(); render();
}
load();
</script>
