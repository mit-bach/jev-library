# Standalone workspace root, so pnpm never resolves this folder into a sibling monorepo.
packages:
  - '.'
# tsx needs esbuild's postinstall to place its binary.
allowBuilds:
  esbuild: true
# Freshly published SDK versions the global minimumReleaseAge cooldown would otherwise block.
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.87'
  - '@ai-sdk/provider-utils@5.0.45'
  - ai@7.0.107
