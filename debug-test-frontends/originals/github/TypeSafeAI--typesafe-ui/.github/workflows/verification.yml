name: Workspace verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Activate the repository-pinned pnpm
        run: corepack enable
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Sharing source contract
        run: node --test scripts/social-metadata.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Type checks
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Browser and rendered-image verification
        run: pnpm test:e2e
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-browser-evidence-${{ github.sha }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
